name: GitHub traffic

# Raz w tygodniu (poniedziałek rano) push na telefon (ntfy) z ruchem w publicznych repo portfolio:
# wyświetlenia, unikalne osoby i klonowania z 7 dni + top 3 źródła (agregat 14 dni GitHuba).
# Sekrety: TRAFFIC_TOKEN (fine-grained PAT, Administration: Read-only), NTFY_URL, opcjonalnie
# NTFY_TOKEN — konfiguracja w docs/operacje/RUNBOOK.md §6. Bez sekretów przebieg kończy się na zielono.
on:
  schedule:
    - cron: '17 6 * * 1'   # poniedziałek 06:17 UTC (poza pełną godziną — mniej opóźnień)
  workflow_dispatch:

permissions: {}   # GITHUB_TOKEN niepotrzebny — Traffic API czyta TRAFFIC_TOKEN

concurrency:
  group: github-traffic
  cancel-in-progress: false

jobs:
  report:
    name: Raport ruchu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'   # = obraz produkcyjny (test_runtime_versions)
      - name: Wyślij raport
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python .github/scripts/github_traffic.py
