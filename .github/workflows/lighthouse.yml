name: Lighthouse — strona logowania

# Dostępność, szybkość, dobre praktyki i SEO strony logowania (druga lista PO, pkt 14). Backend serwuje
# zbudowany panel pod jednym adresem — jak na produkcji; progi w frontend/scripts/lighthouse-assert.mjs.
# Raport HTML trafia do artefaktów, tabela wyników do podsumowania joba. Drafty pomijane.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/lighthouse.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: ${{ github.event.pull_request.draft && 'Lighthouse (draft — pominięty)' || 'Lighthouse' }}
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install --require-hashes -r requirements.txt
        working-directory: backend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Backend z panelem (SQLite, bez zadań w tle)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./lighthouse.db
          RUN_BACKGROUND_JOBS: 'false'
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
      - name: Lighthouse
        working-directory: frontend
        run: |
          export CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          npx --yes lighthouse@12.6.1 http://localhost:8000/ --quiet \
            --chrome-flags="--headless=new --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output=html --output-path=./lighthouse
          node scripts/lighthouse-assert.mjs lighthouse.report.json "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-raport
          path: frontend/lighthouse.report.*
          retention-days: 14
