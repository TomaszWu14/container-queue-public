# Publiczne demo portfolio w Coolify (Docker Compose): dane fikcyjne, konto „demo” tylko do odczytu.
# Hasła i klucz generuje Coolify (zmienne SERVICE_PASSWORD_* — nikt ich nie wpisuje ręcznie).
# Przy każdym starcie kontenera dane demo są wgrywane od nowa (seed_demo kasuje poprzednie).
# Domena w Coolify dla usługi „app”: https://container.queue.twapp.pl:8000 (8000 = port kontenera).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: timporye
      POSTGRES_USER: timporye
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timporye"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:   # rotacja docker logs — bez niej dysk hosta może się zapchać
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-dev}
    init: true
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      db:
        condition: service_healthy
    logging:   # rotacja docker logs — bez niej dysk hosta może się zapchać
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://timporye:${SERVICE_PASSWORD_POSTGRES}@db:5432/timporye
      SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEY}
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      # US-028: konta per rola (spedytor, agencja celna, magazyn) — każde tylko do odczytu, to samo hasło;
      # pierwsze (demo = logistyka) dostaje przycisk „Wejdź jako demo” na ekranie logowania
      DEMO_READONLY_LOGINS: demo,demo-spedytor,demo-agencja,demo-magazyn
      DEMO_PASSWORD: demoportfolio2026   # celowo jawne: konto tylko do odczytu, podane w README
      SUPPORT_EMAIL: tomasz.wierzbowski@op.pl   # „Zgłoś problem” na ekranie logowania i w banerze demo
      PUBLIC_BASE_URL: https://container.queue.twapp.pl
      SECURE_COOKIES: "true"             # demo za HTTPS (Traefik); bez tego produkcja nie wstaje
      MAIL_BACKEND: console              # demo nie wysyła maili
      VERIFY_BACKUP_WEEKDAY: "-1"        # demo nie robi kopii — bez tego co tydzień błąd + alert adminów
      UPLOADS_DIR: /data/uploads
    command: >-
      sh -c "alembic upgrade head
      && python -m scripts.seed_demo --wyczysc-wszystko
      && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='172.16.0.0/12,127.0.0.1/32'"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
